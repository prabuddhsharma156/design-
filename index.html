<!DOCTYPE html>

            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }
        .page {
            display: none;
        }
        .page.active {
            display: flex; /* Use flexbox for centering content */
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            width: 100%;
            padding: 1rem;

        /* The landing page doesn't need a content box, just the overlay */
        #landing-page {
            background-color: rgba(0, 0, 0, 0.5);
        }
        /* Custom scrollbar for all scrollable elements */
        .custom-scrollbar::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #e0e0e0;
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #555;
        }
        .content-card {
            background-color: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            max-height: 90vh; /* Prevent card from being taller than the viewport */
            overflow-y: auto; /* Add vertical scroll inside the card if needed */
        }

</head>

        // --- PAGE NAVIGATION ---
        function showPage(pageId) {
            document.querySelectorAll('.page').forEach(page => page.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
        }

        // --- WEATHER LOGIC ---
        const stateSelect = document.getElementById('state-select');
        const districtSelect = document.getElementById('district-select');
        const districtSelectionDiv = document.getElementById('district-selection');
        const weatherResultDiv = document.getElementById('weather-result');

        Object.keys(locations).forEach(state => {
            const option = document.createElement('option');
            option.value = state;
            option.textContent = state;
            stateSelect.appendChild(option.cloneNode(true));
        });

        stateSelect.addEventListener('change', () => {
            const selectedState = stateSelect.value;
            districtSelect.innerHTML = '<option value="">-- जिले का चयन करें --</option>';
            weatherResultDiv.innerHTML = '';
            if (selectedState) {
                districtSelectionDiv.classList.remove('hidden');
                locations[selectedState].forEach(district => {
                    const option = document.createElement('option');
                    option.value = district;
                    option.textContent = district;
                    districtSelect.appendChild(option);
                });
            } else {
                districtSelectionDiv.classList.add('hidden');
            }
        });
        
        districtSelect.addEventListener('change', () => {
            const selectedDistrict = districtSelect.value;
            if (selectedDistrict) fetchWeather(selectedDistrict);
        });

        async function fetchWeather(district) {
            if (WEATHER_API_KEY === "YOUR_API_KEY" || !WEATHER_API_KEY) {
                weatherResultDiv.innerHTML = `<div class="text-red-600 bg-red-100 p-4 rounded-lg"><strong>Error:</strong> Weather API Key is not configured. Please get a key from weatherapi.com and paste it in the code.</div>`;
                return;
            }
            weatherResultDiv.innerHTML = `<div class="text-center p-4">Loading weather data...</div>`;
            const url = `https://api.weatherapi.com/v1/forecast.json?key=${WEATHER_API_KEY}&q=${district}&days=10&aqi=no&alerts=no&lang=hi`;
            try {
                const response = await fetch(url);
                const data = await response.json();
                if (!response.ok) {
                    throw new Error(data.error ? data.error.message : 'Unknown API error');
                }
                displayWeather(data);
            } catch (error) {
                console.error("Fetch Weather Error:", error);
                weatherResultDiv.innerHTML = `<div class="text-red-600 bg-red-100 p-4 rounded-lg"><strong>Error:</strong> ${error.message}</div>`;
            }
        }

        function displayWeather(data) {
            let html = `<h3 class="text-2xl font-bold text-gray-700 mb-4 text-center">${data.location.name} - 10-Day Forecast</h3>
                        <div class="custom-scrollbar overflow-x-auto pb-4">
                            <div class="flex space-x-4">`;
            data.forecast.forecastday.forEach(day => {
                const date = new Date(day.date_epoch * 1000);
                const dayName = date.toLocaleString('hi-IN', { weekday: 'short' });
                const fullDate = date.toLocaleString('en-IN', { day: 'numeric', month: 'short' });
                const iconUrl = `https:${day.day.condition.icon}`;
                html += `<div class="flex-shrink-0 w-36 text-center bg-blue-100 p-4 rounded-lg shadow"><p class="font-semibold text-blue-800">${dayName}, ${fullDate}</p><img src="${iconUrl}" alt="${day.day.condition.text}" class="mx-auto w-16 h-16"><p class="text-lg font-bold text-gray-800">${Math.round(day.day.avgtemp_c)}°C</p><p class="text-sm text-gray-600 capitalize">${day.day.condition.text}</p><p class="text-xs text-gray-500 mt-2">💧 ${day.day.avghumidity}%</p></div>`;
            });
            html += `</div></div>`;
            weatherResultDiv.innerHTML = html;
        }

        // --- PRICES LOGIC ---
        const stateSelectPrices = document.getElementById('state-select-prices');
        const districtSelectPrices = document.getElementById('district-select-prices');
        const districtSelectionPricesDiv = document.getElementById('district-selection-prices');
        const pricesResultDiv = document.getElementById('prices-result');

        Object.keys(locations).forEach(state => {
            const option = document.createElement('option');
            option.value = state;
            option.textContent = state;
            stateSelectPrices.appendChild(option);
        });
        
        stateSelectPrices.addEventListener('change', () => {
            const selectedState = stateSelectPrices.value;
            districtSelectPrices.innerHTML = '<option value="">-- जिले का चयन करें --</option>';
            pricesResultDiv.innerHTML = '';
            if (selectedState) {
                districtSelectionPricesDiv.classList.remove('hidden');
                locations[selectedState].forEach(district => {
                    const option = document.createElement('option');
                    option.value = district;
                    option.textContent = district;
                    districtSelectPrices.appendChild(option);
                });
            } else {
                districtSelectionPricesDiv.classList.add('hidden');
            }
        });

        districtSelectPrices.addEventListener('change', () => {
            const selectedState = stateSelectPrices.value;
            const selectedDistrict = districtSelectPrices.value;
            if (selectedDistrict && selectedState) {
                displayPrices(selectedState, selectedDistrict);
            }
        });

        function displayPrices(state, district) {
            const prices = cropPrices[state]?.[district];
            if (!prices) {
                pricesResultDiv.innerHTML = `<div class="text-yellow-600 bg-yellow-100 p-4 rounded-lg">इस जिले के लिए मूल्य डेटा उपलब्ध नहीं है।</div>`;
                return;
            }

            let html = `<h3 class="text-2xl font-bold text-gray-700 mb-4 text-center">${district}, ${state} - मंडी भाव (प्रति क्विंटल)</h3>
                        <div class="overflow-x-auto rounded-lg border border-gray-200">
                            <table class="min-w-full divide-y-2 divide-gray-200 bg-white text-sm">
                                <thead class="ltr:text-left rtl:text-right">
                                    <tr>
                                        <th class="whitespace-nowrap px-4 py-3 font-medium text-gray-900">फसल</th>
                                        <th class="whitespace-nowrap px-4 py-3 font-medium text-gray-900">अनुमानित मूल्य</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-gray-200 text-center">`;
            
            for (const crop in prices) {
                html += `<tr>
                            <td class="whitespace-nowrap px-4 py-3 font-medium text-gray-900">${crop}</td>
                            <td class="whitespace-nowrap px-4 py-3 text-gray-700">₹ ${prices[crop].toLocaleString('hi-IN')}</td>
                         </tr>`;
            }

            html += `</tbody></table></div>
                    <p class="mt-4 text-xs text-gray-500 text-center"><strong>अस्वीकरण:</strong> ये मूल्य अनुमानित हैं और वास्तविक मंडी भाव से भिन्न हो सकते हैं।</p>`;
            pricesResultDiv.innerHTML = html;
        }


        // --- PESTICIDE LOGIC ---
        const cropButtonsDiv = document.getElementById('crop-buttons');
        const pesticideInfoDiv = document.getElementById('pesticide-info');
        Object.keys(crops).forEach(cropName => {
            const button = document.createElement('button');
            button.className = 'bg-yellow-400 text-gray-800 p-4 rounded-lg shadow-md hover:bg-yellow-500 font-semibold transition-transform transform hover:scale-105';
            button.textContent = cropName;
            button.onclick = () => showPesticideInfo(cropName);
            cropButtonsDiv.appendChild(button);
        });
        function showPesticideInfo(cropName) {
            pesticideInfoDiv.classList.remove('hidden');
            const cropData = crops[cropName];
            let html = `<h4 class="text-xl font-bold text-gray-800 mb-4">${cropName} के लिए कीटनाशक सुझाव</h4>`;
            
            cropData.pesticides.forEach(pest => {
                html += `
                    <div class="mb-4 p-3 border rounded-lg bg-white shadow-sm">
                        <p class="font-bold text-lg text-green-700">${pest.name}</p>
                        <p class="text-gray-600"><span class="font-semibold">लक्ष्य:</span> ${pest.target}</p>
                        <p class="text-gray-600"><span class="font-semibold">मात्रा:</span> ${pest.quantity}</p>
                    </div>
                `;
            });
            
             html += `<p class="mt-4 text-sm text-red-600"><strong>अस्वीकरण:</strong> किसी भी कीटनाशक का उपयोग करने से पहले कृपया एक स्थानीय कृषि विशेषज्ञ से सलाह लें। मात्रा और उपयोग विधि मिट्टी और मौसम की स्थिति के आधार पर भिन्न हो सकती है।</p>`;

            pesticideInfoDiv.innerHTML = html;
        }

        // --- PROFIT LOGIC ---
        const cropProfitSelect = document.getElementById('crop-profit-select');
        const costInput = document.getElementById('cost-input');
        const profitResultDiv = document.getElementById('profit-result');
        Object.keys(crops).forEach(cropName => {
            const option = document.createElement('option');
            option.value = cropName;
            option.textContent = cropName;
            cropProfitSelect.appendChild(option);
        });
        function calculateProfit() {
            const selectedCrop = cropProfitSelect.value;
            const cost = parseFloat(costInput.value);
            if (!selectedCrop || isNaN(cost) || cost <= 0) {
                profitResultDiv.innerHTML = `<p class="font-semibold text-red-700">कृपया मान्य फसल और लागत दर्ज करें।</p>`;
                profitResultDiv.classList.remove('hidden');
                profitResultDiv.classList.remove('border-green-200', 'bg-green-100');
                profitResultDiv.classList.add('border-red-200', 'bg-red-100');
                return;
            }
            const mandiPrice = crops[selectedCrop].mandi_price;
            const averageYield = { "चावल": 20, "गेहूँ": 20, "मक्का": 25, "कपास": 10, "गन्ना": 300 }[selectedCrop];
            const totalIncome = mandiPrice * averageYield;
            const profit = totalIncome - cost;
            profitResultDiv.innerHTML = `
                <h4 class="text-xl font-bold text-green-800 mb-2">${selectedCrop} के लिए लाभ विश्लेषण</h4>
                <p class="text-gray-700">अनुमानित मंडी भाव: <span class="font-semibold">₹${mandiPrice}/क्विंटल</span></p>
                <p class="text-gray-700">अनुमानित उपज: <span class="font-semibold">${averageYield} क्विंटल/एकड़</span></p>
                <p class="text-gray-700">कुल आय: <span class="font-semibold">₹${totalIncome.toLocaleString('hi-IN')}</span></p>
                <p class="text-gray-700">आपकी लागत: <span class="font-semibold">- ₹${cost.toLocaleString('hi-IN')}</span></p>
                <hr class="my-2">
                <p class="text-lg text-green-900">अनुमानित शुद्ध लाभ (प्रति एकड़): <span class="font-bold text-2xl">₹${profit.toLocaleString('hi-IN')}</span></p>`;
            profitResultDiv.classList.remove('hidden');
            profitResultDiv.classList.remove('border-red-200', 'bg-red-100');
            profitResultDiv.classList.add('border-green-200', 'bg-green-100');
        }
    </script>
</body>
</html>
