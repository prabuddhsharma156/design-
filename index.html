<!DOCTYPE html>
<html lang="hi">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-image: url('https://thumbs.dreamstime.com/b/asian-farmer-working-field-morning-time-farmer-examining-his-young-corn-plant-cultivated-agricultural-field-business-270414528.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }
        .page {
            display: none;
        }
        .page.active {
            display: flex; /* Use flexbox for centering content */
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            width: 100%;
            padding: 1rem;
        }
        /* The landing page doesn't need a content box, just the overlay */
        #landing-page {
            background-color: rgba(0, 0, 0, 0.5);
        }
        /* Custom scrollbar for all scrollable elements */
        .custom-scrollbar::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #9ca3af; /* gray-400 */
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #6b7280; /* gray-500 */
        }
        .content-card {
            background-color: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            max-height: 90vh; /* Prevent card from being taller than the viewport */
            overflow-y: auto; /* Add vertical scroll inside the card if needed */
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.1);
        }
        .spinner {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            border: 6px solid #e5e7eb; /* gray-200 */
            border-top-color: #3b82f6; /* blue-500 */
            animation: spin 1s linear infinite;
            margin: 2rem auto;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <!-- Landing Page -->
    <div id="landing-page" class="page active">
        <div class="text-center p-4">
            <h1 class="text-white text-4xl md:text-6xl font-bold mb-2">किसान मित्र</h1>
            <h2 class="text-white text-2xl md:text-4xl font-light mb-4">(Kisan Mitra)</h2>
            <p class="text-white text-lg md:text-2xl mb-8" data-translate-key="tagline">आपका विश्वसनीय कृषि साथी</p>
            <div class="flex flex-col md:flex-row gap-4 justify-center">
                <button onclick="setLanguageAndShow('en', 'menu-page')" class="bg-blue-600 text-white text-xl font-bold py-3 px-8 rounded-lg shadow-lg hover:bg-blue-700 transition-transform transform hover:scale-105">English</button>
                <button onclick="setLanguageAndShow('hi', 'menu-page')" class="bg-green-600 text-white text-xl font-bold py-3 px-8 rounded-lg shadow-lg hover:bg-green-700 transition-transform transform hover:scale-105">हिन्दी</button>

            </div>
        </div>
    </div>

                    <p class="text-sm mt-1" data-translate-key="weatherDesc">10-दिन का पूर्वानुमान</p>
                </button>

                    <p class="text-sm mt-1" data-translate-key="pricesDesc">मंडी भाव जानें</p>
                </button>
                <button onclick="showPage('pesticide-page')" class="flex flex-col items-center justify-center text-center bg-yellow-500 text-white p-6 rounded-lg shadow-md hover:bg-yellow-600 transition-all transform hover:scale-105">

                    <h3 class="text-xl font-semibold" data-translate-key="pesticideTitle">कीटनाशक जानकारी</h3>
                    <p class="text-sm mt-1" data-translate-key="pesticideDesc">सही कीटनाशक चुनें</p>

        function updateUIText() {
            const langTranslations = translations[currentLanguage];
            document.querySelectorAll('[data-translate-key]').forEach(element => {
                const key = element.getAttribute('data-translate-key');
                if (langTranslations[key]) {
                    element.innerHTML = langTranslations[key];
                }
            });
            // Special cases for placeholders and titles
            document.title = currentLanguage === 'en' ? 'Kisan Mitra' : (currentLanguage === 'pa' ? 'ਕਿਸਾਨ ਮਿੱਤਰ' : 'किसान मित्र');
            const costInput = document.getElementById('cost-input');
            if(costInput) costInput.placeholder = langTranslations.costPlaceholder;

            // Re-initialize dynamic elements like dropdowns
            setupAllDropdowns();
            setupDynamicButtons();
        }
        
        function setupDropdown(stateElement, districtElement, districtContainer, resultContainer) {
            const locationsData = locations[currentLanguage];
            stateElement.innerHTML = `<option value="">${translations[currentLanguage].selectStateDefault}</option>`;
            Object.keys(locationsData).forEach(state => {
                const option = document.createElement('option');
                option.value = state;
                option.textContent = state;
                stateElement.appendChild(option);
            });

            stateElement.addEventListener('change', () => {
                const selectedState = stateElement.value;
                districtElement.innerHTML = `<option value="">${translations[currentLanguage].selectDistrictDefault}</option>`;
                if(resultContainer) resultContainer.innerHTML = '';
                
                if (selectedState) {
                    districtContainer.classList.remove('hidden');
                    // Find the english state name to get english district names
                    const stateKeysEn = Object.keys(locations.en);
                    const stateKeysCurrent = Object.keys(locations[currentLanguage]);
                    const stateIndex = stateKeysCurrent.indexOf(selectedState);
                    const englishStateName = stateKeysEn[stateIndex];

                    const districts = locations.en[englishStateName] || [];
                    districts.forEach(district => {
                        const option = document.createElement('option');
                        option.value = district;
                        option.textContent = district;
                        districtElement.appendChild(option);
                    });
                } else {
                    districtContainer.classList.add('hidden');
                }
            });
        }

        // --- WEATHER LOGIC ---
        async function fetchWeather(district) {
            const weatherResultDiv = document.getElementById('weather-result');
            if (WEATHER_API_KEY === "a471efb91f4c4e29ac9135831252209" || !WEATHER_API_KEY) {
                weatherResultDiv.innerHTML = `<div class="text-red-600 bg-red-100 p-4 rounded-lg">${translations[currentLanguage].errorApiKey}</div>`;
                return;
            }
            
            weatherResultDiv.innerHTML = '';
            spinner.classList.remove('hidden');
            weatherResultDiv.appendChild(spinner);
            
            const url = `https://api.weatherapi.com/v1/forecast.json?key=${WEATHER_API_KEY}&q=${district}&days=10&aqi=no&alerts=no&lang=${currentLanguage}`;
            try {
                const response = await fetch(url);
                const data = await response.json();
                if (!response.ok) { throw new Error(data.error ? data.error.message : 'Unknown API error'); }
                displayWeather(data);
            } catch (error) {
                weatherResultDiv.innerHTML = `<div class="text-red-600 bg-red-100 p-4 rounded-lg">${translations[currentLanguage].errorApiGeneric} ${error.message}</div>`;
            } finally {
                spinner.classList.add('hidden');
            }
        }

        function displayWeather(data) {
            const weatherResultDiv = document.getElementById('weather-result');
            let html = `<div class="custom-scrollbar overflow-x-auto pb-4"><div class="flex space-x-4">`;
            data.forecast.forecastday.forEach(day => {
                const date = new Date(day.date_epoch * 1000);
                const dayName = date.toLocaleString(`${currentLanguage}-IN`, { weekday: 'short' });
                const fullDate = date.toLocaleString('en-IN', { day: 'numeric', month: 'short' });
                html += `<div class="flex-shrink-0 w-36 text-center bg-blue-100 p-4 rounded-lg shadow"><p class="font-semibold text-blue-800">${dayName}, ${fullDate}</p><img src="https:${day.day.condition.icon}" alt="${day.day.condition.text}" class="mx-auto w-16 h-16"><p class="text-lg font-bold text-gray-800">${Math.round(day.day.avgtemp_c)}°C</p><p class="text-sm text-gray-600 capitalize">${day.day.condition.text}</p><p class="text-xs text-gray-500 mt-2">💧 ${day.day.avghumidity}%</p></div>`;
            });
            html += `</div></div>`;
            weatherResultDiv.innerHTML = html;
        }

        // --- PRICES LOGIC ---
        function displayPrices(state, district) {
            const pricesResultDiv = document.getElementById('prices-result');
            
            const stateKeysCurrent = Object.keys(locations[currentLanguage]);
            const stateIndex = stateKeysCurrent.indexOf(state);
            const hindiStateName = Object.keys(locations.hi)[stateIndex];

            const prices = cropPrices[hindiStateName]?.[district];

            if (!prices) {
                pricesResultDiv.innerHTML = `<div class="text-yellow-800 bg-yellow-100 p-4 rounded-lg">${translations[currentLanguage].priceErrorNoData}</div>`;
                return;
            }

            let html = `<h3 class="text-xl font-bold text-gray-700 mb-4">${translations[currentLanguage].priceAnalysisTitle} ${district}</h3><div class="overflow-x-auto rounded-lg border border-gray-200"><table class="min-w-full divide-y-2 divide-gray-200 bg-white text-sm"><thead class="ltr:text-left rtl:text-right"><tr><th class="whitespace-nowrap px-4 py-3 font-medium text-gray-900">${translations[currentLanguage].crop}</th><th class="whitespace-nowrap px-4 py-3 font-medium text-gray-900">${translations[currentLanguage].price}</th></tr></thead><tbody class="divide-y divide-gray-200 text-center">`;
            
            const currentCrops = crops[currentLanguage];
            Object.keys(currentCrops).forEach(cropName => {
                const cropKeysCurrent = Object.keys(crops[currentLanguage]);
                const cropIndex = cropKeysCurrent.indexOf(cropName);
                const hindiCropName = Object.keys(crops.hi)[cropIndex];
                
                const price = prices[hindiCropName] || 'N/A';
                html += `<tr><td class="whitespace-nowrap px-4 py-3 font-medium text-gray-900">${cropName}</td><td class="whitespace-nowrap px-4 py-3 text-gray-700">₹ ${price.toLocaleString(`${currentLanguage}-IN`)}</td></tr>`;
            });

            html += `</tbody></table></div><p class="mt-4 text-xs text-gray-500 text-center">${translations[currentLanguage].disclaimerPrices}</p>`;
            pricesResultDiv.innerHTML = html;
        }

        // --- PESTICIDE LOGIC ---
        function showPesticideInfo(cropName) {
            const pesticideInfoDiv = document.getElementById('pesticide-info');
            pesticideInfoDiv.classList.remove('hidden');
            const cropData = crops[currentLanguage][cropName];
            let html = `<h4 class="text-xl font-bold text-gray-800 mb-4">${cropName} ${translations[currentLanguage].pesticideSuggestion}</h4>`;
            cropData.pesticides.forEach(pest => {
                html += `<div class="mb-4 p-3 border rounded-lg bg-white shadow-sm"><p class="font-bold text-lg text-green-700">${pest.name}</p><p class="text-gray-600"><span class="font-semibold">${translations[currentLanguage].target}:</span> ${pest.target}</p><p class="text-gray-600"><span class="font-semibold">${translations[currentLanguage].quantity}:</span> ${pest.quantity}</p></div>`;
            });
            html += `<p class="mt-4 text-sm text-red-600">${translations[currentLanguage].disclaimerPesticide}</p>`;
            pesticideInfoDiv.innerHTML = html;
        }

        // --- PROFIT LOGIC ---
        function calculateProfit() {
            const profitResultDiv = document.getElementById('profit-result');
            const selectedCrop = document.getElementById('crop-profit-select').value;
            const cost = parseFloat(document.getElementById('cost-input').value);
            if (!selectedCrop || isNaN(cost) || cost <= 0) {
                profitResultDiv.innerHTML = `<div class="text-red-700 bg-red-100 border border-red-200 p-4 rounded-lg"><p class="font-semibold">${translations[currentLanguage].profitError}</p></div>`;
                profitResultDiv.classList.remove('hidden');
                return;
            }
            const mandiPrice = crops[currentLanguage][selectedCrop].mandi_price;
            const averageYield = { "Rice": 20, "चावल": 20, "ਚਾਵਲ": 20, "Wheat": 20, "गेहूँ": 20, "ਕਣਕ": 20, "Maize": 25, "मक्का": 25, "ਮੱਕੀ": 25, "Cotton": 10, "कपास": 10, "ਕਪਾਹ": 10, "Sugarcane": 300, "गन्ना": 300, "ਗੰਨਾ": 300 }[selectedCrop];
            const totalIncome = mandiPrice * averageYield;
            const profit = totalIncome - cost;
            const t = translations[currentLanguage];
            profitResultDiv.innerHTML = `<div class="text-left p-4 bg-green-100 border border-green-200 rounded-lg space-y-2"><h4 class="text-xl font-bold text-green-800 mb-2">${selectedCrop} ${t.profitAnalysisTitle}</h4><p>${t.marketPrice}: <span class="font-semibold">₹${mandiPrice.toLocaleString(`${currentLanguage}-IN`)}/क्विंटल</span></p><p>${t.yield}: <span class="font-semibold">${averageYield.toLocaleString(`${currentLanguage}-IN`)} क्विंटल/एकड़</span></p><p>${t.totalIncome}: <span class="font-semibold">₹${totalIncome.toLocaleString(`${currentLanguage}-IN`)}</span></p><p>${t.yourCost}: <span class="font-semibold">- ₹${cost.toLocaleString(`${currentLanguage}-IN`)}</span></p><hr class="border-green-300"><p class="text-lg text-green-900">${t.netProfit}: <span class="font-bold text-2xl">₹${profit.toLocaleString(`${currentLanguage}-IN`)}</span></p></div>`;
            profitResultDiv.classList.remove('hidden');
        }
    </script>
</body>
</html>
